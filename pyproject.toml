[project]
name = "aiday-demo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "byteplus-python-sdk-v2>=3.0.58",
    "distro>=1.9.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "qrcode>=8.2",
    "requests>=2.34.2",
    "sniffio>=1.3.1",
    "tos>=2.9.2",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
aiday-demo = "aiday_demo:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
