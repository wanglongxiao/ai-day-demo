<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Step into the Lead Role with Lumina</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Password gate (cloud only) -->
  <div id="gate" class="gate hidden">
    <div class="gate-card">
      <h2 data-i18n="gate_title">Access</h2>
      <input id="gate-pwd" type="password" data-i18n-ph="gate_ph" />
      <button id="gate-btn" data-i18n="gate_btn">Enter</button>
      <p id="gate-err" class="err hidden" data-i18n="gate_err">Wrong password</p>
    </div>
  </div>

  <header class="topbar">
    <h1 id="title">
      <span>Step into the Lead Role with Lumina</span>
      <span>(Powered by Dreamina Seedance 2.5)</span>
    </h1>
    <div class="lang">
      <select id="lang-select" aria-label="語言" data-i18n-aria-label="language_label">
        <option value="zh-TW">繁中</option>
        <option value="en">EN</option>
      </select>
    </div>
  </header>

  <!-- Demo image -->
  <section class="demo">
    <img id="demo-image"
         src="https://2026-ai-day.tos-cn-hongkong.bytepluses.com/assets/demo.jpg"
         alt="Lumina 影片體驗預覽" data-i18n-alt="demo_alt" />
  </section>

  <main class="content">
    <!-- CREATE VIEW -->
    <section id="create-view">
      <div class="card">
        <fieldset class="gender-field">
          <legend data-i18n="gender_label">Gender</legend>
          <div id="gender-options" class="gender-options">
            <button class="gender-option" type="button" role="radio"
                    aria-checked="false" data-gender="male">
              <span class="gender-figure" aria-hidden="true">
                <span class="gender-symbol-glyph">♂</span>
              </span>
              <span class="gender-name" data-i18n="gender_male">Male</span>
            </button>
            <button class="gender-option" type="button" role="radio"
                    aria-checked="false" data-gender="female">
              <span class="gender-figure" aria-hidden="true">
                <span class="gender-symbol-glyph">♀</span>
              </span>
              <span class="gender-name" data-i18n="gender_female">Female</span>
            </button>
          </div>
        </fieldset>

        <label class="field">
          <span data-i18n="upload_label">Upload a front-facing half-body portrait; the face must occupy at least 1/5 of the image</span>
          <input id="image-input" type="file" accept="image/*" disabled />
        </label>
        <div id="preview-wrap" class="preview hidden">
          <img id="preview-img" alt="上傳相片預覽" data-i18n-alt="preview_alt" />
        </div>

        <button id="generate-btn" class="primary" data-i18n="generate_btn">Generate Video</button>
        <p id="create-err" class="err hidden"></p>
      </div>

      <!-- Submitted / QR panel -->
      <div id="submitted-panel" class="card hidden">
        <p class="notice" id="submitted-notice" data-i18n="submitted_notice"></p>
        <div class="qr">
          <img id="qr-img" alt="影片任務 QR Code" data-i18n-alt="qr_alt" />
        </div>
        <a id="task-link" class="task-link" href="#" target="_blank"></a>
      </div>
    </section>

    <!-- TASK VIEW -->
    <section id="task-view" class="hidden">
      <div class="card">
        <div id="task-status" class="status-box">
          <div class="spinner" id="task-spinner"></div>
          <p id="task-message" data-i18n="task_generating">Your video is still being generated..</p>
        </div>
        <div id="task-result" class="hidden">
          <video id="result-video" controls playsinline
                 aria-label="生成的影片" data-i18n-aria-label="result_video_label"></video>
          <a id="download-link" class="primary as-btn" download>
            <span data-i18n="download_btn">Download Video</span>
          </a>
          <div class="url-box">
            <code id="result-url"></code>
          </div>
        </div>
        <a id="back-home" class="task-link" href="/" data-i18n="back_home">← Back to home</a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>© 2026 · SeeDance</span>
  </footer>

  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
